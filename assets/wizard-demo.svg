    <text x="26" y="366" fill="#3fb950">&#10004; Acc &#8594; Earthy Senja</text>

    <text x="26" y="408"><tspan fill="#3fb950">&#10004;</tspan><tspan fill="#c9c6ba" dx="8">Brief tersimpan &#8594;</tspan><tspan fill="#d2a93b" dx="6">dewa/brief.json</tspan></text>
