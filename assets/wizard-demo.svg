<svg xmlns="http://www.w3.org/2000/svg" width="780" height="464" viewBox="0 0 780 464" role="img" aria-label="Illustration of the Deus wizard flow in a terminal">
  <defs>
    <clipPath id="win"><rect x="1" y="1" width="778" height="462" rx="12"/></clipPath>
  </defs>

  <rect x="1" y="1" width="778" height="462" rx="12" fill="#0d0e12" stroke="#2a2c35" stroke-width="1.5"/>

  <g clip-path="url(#win)">
    <rect x="1" y="1" width="778" height="38" fill="#171922"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="6" fill="#febc2e"/>
    <circle cx="64" cy="20" r="6" fill="#28c840"/>
    <text x="390" y="25" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#6e6b5e">claude &#8212; Deus</text>
  </g>

  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="13">
    <text x="26" y="72"><tspan fill="#6e6b5e">$</tspan><tspan fill="#c9c6ba" dx="8">claude</tspan></text>
    <text x="26" y="96"><tspan fill="#d2a93b">&#8250;</tspan><tspan fill="#eae7db" dx="8">/deus:build Aurora Coffee</tspan></text>

    <text x="26" y="138"><tspan fill="#d2a93b">&#9670; Deus</tspan><tspan fill="#c9c6ba" dx="6">&#8212; project</tspan><tspan fill="#eae7db" dx="6">"Aurora Coffee"</tspan><tspan fill="#c9c6ba" dx="6">&#8594; folder</tspan><tspan fill="#d2a93b" dx="6">aurora-coffee/</tspan></text>

    <text x="26" y="180" fill="#a5a294">? Purpose &#8212; approve one:</text>
    <text x="44" y="204"><tspan fill="#d2a93b">&#9679; Business</tspan><tspan fill="#6e6b5e" dx="8">&#8212; company profile &amp; services</tspan></text>
    <text x="44" y="228" fill="#6e6b5e">&#9675; Personal&#160;&#160;&#160;&#160;&#9675; Organization&#160;&#160;&#160;&#160;&#9675; Store</text>
    <text x="26" y="252" fill="#3fb950">&#10004; Approved &#8594; Business</text>

    <text x="26" y="294" fill="#a5a294">? Color direction &#8212; 4 palettes designed from your brief:</text>
    <text x="44" y="318"><tspan fill="#d2a93b">&#9679; Earthy Dusk</tspan></text>
    <g transform="translate(178 306)">
      <rect width="15" height="15" rx="3" fill="#f6efe6" stroke="#2a2c35"/>
      <rect x="21" width="15" height="15" rx="3" fill="#2b2118" stroke="#2a2c35"/>
      <rect x="42" width="15" height="15" rx="3" fill="#c46a2b" stroke="#2a2c35"/>
    </g>
    <text x="44" y="342" fill="#6e6b5e">&#9675; Dark Roast&#160;&#160;&#160;&#160;&#9675; Modern Cream&#160;&#160;&#160;&#160;&#9675; Warm Tropic</text>
    <text x="26" y="366" fill="#3fb950">&#10004; Approved &#8594; Earthy Dusk</text>

    <text x="26" y="408"><tspan fill="#3fb950">&#10004;</tspan><tspan fill="#c9c6ba" dx="8">Brief saved &#8594;</tspan><tspan fill="#d2a93b" dx="6">deus/brief.json</tspan></text>
    <text x="26" y="432" fill="#6e6b5e">your project's foundation &#8212; ready to build</text>
