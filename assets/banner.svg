  <text x="640" y="258" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="60" letter-spacing="10" fill="#eae7db">PLUGIN <tspan fill="url(#gold)">DEWA</tspan></text>
  <text x="640" y="296" text-anchor="middle" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" font-size="19" fill="#a5a294">Pabrik website all-in-one &#8212; satu nama, acc satu per satu, hasil company-grade.</text>
