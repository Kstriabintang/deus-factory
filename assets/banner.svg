    <rect x="178" y="166" width="8" height="8" transform="rotate(45 182 170)" opacity="0.28"/>
    <rect x="1122" y="164" width="12" height="12" transform="rotate(45 1128 170)" opacity="0.55"/>
    <rect x="1094" y="166" width="8" height="8" transform="rotate(45 1098 170)" opacity="0.28"/>
  </g>
  <g stroke="#d2a93b" stroke-opacity="0.3" stroke-width="1">
